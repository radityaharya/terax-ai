[package]
name = "terax-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "terax-remote"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_child = "1"
terax-control-protocol = { path = "../terax-control-protocol" }
terax-core = { path = "../terax-core" }
getrandom = "0.4"
dirs = "7"
# Iroh P2P fallback transport. Default features include `tls-ring`, which
# uses the `ring` rustls crypto provider - the same one already resolved in
# the workspace via reqwest's HTTP/3 (quinn) support. Explicitly avoid
# `tls-aws-lc-rs` so no second crypto provider gets linked into the binary.
iroh = { version = "1", default-features = false, features = ["tls-ring", "metrics"] }
# n0 Iroh Services preset: mints endpoint-bound relay tokens from a project
# API key for authenticated shared/dedicated relays. Only used when an API
# key is configured; a pure self-hosted relay needs none of this.
iroh-services = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
# Double-fork + setsid daemonization (fork/setsid/dup2/close/getpid).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
